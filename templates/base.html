<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ profile.name }}{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6f5c'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='26' fill='%23fdfcf9' text-anchor='middle'%3E{{ initials }}%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/style.css?v={{ asset_version('static/css/style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="site-title" href="index.html">{{ profile.name }}</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="publications.html">Publications</a>
      <a href="resume.html">Resume</a>
      <a href="resume.pdf?v={{ asset_version('resume.pdf') }}" class="btn-nav">Download CV</a>
    </nav>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <p>&copy; {{ profile.name }}. Publications updated automatically from Google Scholar.</p>
</footer>
</body>
</html>
